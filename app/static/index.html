<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pata | Address Intelligence</title>
  <style>
    :root { --ink:#17213a; --muted:#64748b; --line:#e2e8f0; --card:#fff; --bg:#f7fafc; --brand:#2563eb; --good:#047857; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); background:var(--bg); }
    header { padding:44px max(24px,calc((100vw - 1120px)/2)); color:#fff; background:linear-gradient(115deg,#172554,#1d4ed8); }
    h1 { margin:0; font-size:clamp(2rem,5vw,3.2rem); letter-spacing:-.055em; }
    header p { margin:12px 0 0; max-width:600px; color:#dbeafe; font-size:1.05rem; }
    main { width:min(1120px,calc(100% - 40px)); margin:32px auto 60px; }
    .eyebrow { margin:0 0 10px; color:var(--brand); font-size:.75rem; font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
    h2 { margin:0; font-size:1.25rem; }
    .users { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin:16px 0 32px; }
    button.user { border:1px solid var(--line); border-radius:14px; padding:18px; background:var(--card); text-align:left; cursor:pointer; color:var(--ink); box-shadow:0 1px 2px #0f172a0a; transition:.18s; }
    button.user:hover, button.user.active { border-color:var(--brand); transform:translateY(-2px); box-shadow:0 8px 20px #2563eb22; }
    .user strong, .user span { display:block; } .user span { margin-top:5px; color:var(--muted); font-size:.85rem; }
    .load-exact { margin-top:12px; border:0; border-radius:10px; padding:10px 14px; background:var(--brand); color:#fff; font-weight:700; cursor:pointer; }
    .load-exact:hover { box-shadow:0 8px 20px #2563eb22; }
    #empty { padding:60px 20px; text-align:center; border:1px dashed #cbd5e1; border-radius:16px; color:var(--muted); background:#fff; }
    #result { display:none; }
    #result.visible { display:block; }
    .grid { display:grid; grid-template-columns:1fr 1.25fr; gap:20px; margin-top:16px; }
    .panel { min-width:0; padding:22px; border:1px solid var(--line); border-radius:16px; background:var(--card); box-shadow:0 1px 2px #0f172a0a; }
    .panel h3 { margin:0 0 14px; font-size:1rem; }
    .address { padding:14px; border-radius:10px; background:#f8fafc; line-height:1.55; white-space:pre-wrap; }
    dl { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin:0; }
    dt { color:var(--muted); font-size:.74rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; }
    dd { margin:3px 0 0; word-break:break-word; }
    .coordinates { margin-top:18px; padding:14px; border-left:4px solid var(--good); border-radius:8px; background:#ecfdf5; color:#065f46; }
    .coordinates strong { display:block; margin-bottom:4px; }
    .confidence { margin-top:14px; padding:14px; border-left:4px solid var(--brand); border-radius:8px; background:#eff6ff; color:#1e3a8a; }
    .confidence strong { display:block; margin-bottom:4px; }
    .confidence .reason { margin-top:6px; color:#334155; line-height:1.5; }
    .map-link { display:inline-flex; align-items:center; justify-content:center; margin-top:14px; padding:10px 14px; border-radius:10px; background:var(--brand); color:#fff; text-decoration:none; font-weight:700; transition:transform .18s, box-shadow .18s; }
    .map-link:hover { transform:translateY(-1px); box-shadow:0 8px 20px #2563eb33; }
    .error { padding:18px; border-radius:12px; color:#991b1b; background:#fef2f2; border:1px solid #fecaca; }
    .loading { color:var(--muted); font-size:.95rem; }
    @media (max-width:700px) { .grid { grid-template-columns:1fr; } dl { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>Pata</h1>
    <p>Choose a delivery user to compare their original address with the cleaned, structured and geocoded result.</p>
  </header>
  <main>
    <p class="eyebrow">Demo users</p>
    <h2>Select a user</h2>
    <section id="users" class="users" aria-live="polite"><p class="loading">Loading users…</p></section>
    <section id="empty">Select a user to run the address workflow.</section>
    <section id="result" aria-live="polite"></section>
  </main>
  <script>
    const usersElement = document.querySelector('#users');
    const emptyElement = document.querySelector('#empty');
    const resultElement = document.querySelector('#result');

    const escapeHtml = (value) => String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    const label = value => value.replaceAll('_', ' ');
    const coordinateValue = value => Number.isFinite(Number(value)) ? Number(value).toFixed(6) : '';

    function showResult(data) {
      const address = data.modified_address || {};
      const parsed = address.parsed_address || {};
      const fields = Object.entries(parsed).map(([key, value]) => `<div><dt>${escapeHtml(label(key))}</dt><dd>${escapeHtml(value || '—')}</dd></div>`).join('');
      const lat = address.lat ?? address.latitude;
      const lon = address.lon ?? address.longitude;
      const confidenceScore = address.confidence_score;
      const confidenceReason = address.confidence_reason || '';
      const coordinates = lat != null && lon != null
        ? `<div class="coordinates"><strong>Geocoded location</strong>Lat: ${escapeHtml(coordinateValue(lat))} · Lon: ${escapeHtml(coordinateValue(lon))}<br><a class="map-link" href="/map?lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}&label=${encodeURIComponent(data.name || 'Selected user')}" target="_blank" rel="noopener">Show on map</a></div>`
        : address.latitude != null && address.longitude != null
        ? `<div class="coordinates"><strong>Geocoded location</strong>Latitude: ${escapeHtml(address.latitude)} · Longitude: ${escapeHtml(address.longitude)}</div>`
        : '';
      const confidence = confidenceScore != null
        ? `<div class="confidence"><strong>Confidence score</strong>${escapeHtml(String(confidenceScore))}${confidenceReason ? `<div class="reason"><strong>Reason:</strong> ${escapeHtml(confidenceReason)}</div>` : ''}</div>`
        : '';
      resultElement.innerHTML = `
        <p class="eyebrow">${escapeHtml(data.name)}’s address</p>
        <div class="grid">
          <article class="panel"><h3>Provided address</h3><div class="address">${escapeHtml(data.original_address || address.raw_address || 'No address provided')}</div></article>
          <article class="panel"><h3>Modified address</h3><div class="address">${escapeHtml(address.translated_address || address.raw_address || 'No translated address returned')}</div><h3 style="margin-top:20px">Parsed fields</h3><dl>${fields}</dl>${coordinates}${confidence}</article>
        </div>`;
      emptyElement.style.display = 'none';
      resultElement.classList.add('visible');
    }

    async function selectUser(user, button) {
      document.querySelectorAll('.user').forEach(item => item.classList.remove('active'));
      button.classList.add('active');
      resultElement.classList.remove('visible');
      emptyElement.innerHTML = '<p class="loading">Running translation, parsing and geocoding…</p>';
      emptyElement.style.display = 'block';
      try {
        const response = await fetch(user.detail_url);
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || 'Workflow request failed');
        showResult(data);
      } catch (error) {
        emptyElement.innerHTML = `<div class="error"><strong>Could not process this address.</strong><br>${escapeHtml(error.message)}</div>`;
      }
    }

    async function loadUsers() {
      try {
        const response = await fetch('/users');
        const users = await response.json();
        usersElement.innerHTML = '';
        users.forEach(user => {
          const button = document.createElement('button');
          button.className = 'user';
          button.innerHTML = `<strong>${escapeHtml(user.name)}</strong><span>Get exact address</span>`;
          button.addEventListener('click', () => selectUser(user, button));
          usersElement.appendChild(button);
        });

        const firstUser = users[0];
        if (firstUser) {
          const firstButton = usersElement.querySelector('.user');
          if (firstButton) {
            firstButton.classList.add('active');
            selectUser(firstUser, firstButton);
          }
        }
      } catch (error) {
        usersElement.innerHTML = `<div class="error">Could not load demo users: ${escapeHtml(error.message)}</div>`;
      }
    }
    loadUsers();
  </script>
</body>
</html>
